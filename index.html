<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Internal - E TRIBRATA LOG</title>
  <style>
    :root {
      --primary: #153E75;
      --primary-dark: #0F2D56;
      --secondary: #FBBF24;
      --bg: #F1F5F9;
      --text: #1E293B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .login-card {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .shield {
      width: 40px; height: 40px;
      background: var(--secondary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .shield::after { content: "🛡️"; font-size: 20px; }
    .brand-title { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #475569; }
    .form-control {
      width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px;
    }
    
    .btn-login {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px;
      font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    
    .demo-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed #E2E8F0;
    }
    .demo-title { font-size: 12px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
    
    .btn-demo {
      width: 100%; padding: 12px; border: 2px solid var(--primary); background: transparent; color: var(--primary);
      border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 10px;
      transition: all 0.2s;
    }
    .btn-demo:hover { background: var(--primary); color: white; }

    /* Responsiveness Desktop & Mobile */
    @media (min-width: 1200px) {
      .login-card {
        max-width: 460px;
        padding: 40px 32px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      }
      .brand-title {
        font-size: 24px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .login-card {
        padding: 24px 16px;
        border-radius: 14px;
      }
      .brand-title {
        font-size: 20px;
      }
      .btn-demo {
        font-size: 13px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <div class="shield"></div>
      <div>
        <div class="brand-title">E TRIBRATA LOG</div>
        <div style="font-size: 11px; color: #64748B; font-weight: 600; letter-spacing: 0.5px;">SISTEM LOGBOOK & OPERASIONAL PRESISI</div>
      </div>
    </div>
    
    <form id="login-form" onsubmit="handleInternalLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-nrp">NRP / ID Petugas</label>
        <input type="text" id="login-nrp" class="form-control" placeholder="Masukkan NRP Petugas" value="98040112">
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label class="form-label" for="login-pass">Kata Sandi</label>
        <input type="password" id="login-pass" class="form-control" placeholder="••••••••" value="polripresisi2026">
      </div>
      
      <button type="submit" class="btn-login" style="display:flex; align-items:center; justify-content:center; gap:8px;">
        <span>MASUK KE SISTEM INTERNAL</span>
        <span>➔</span>
      </button>
    </form>
    
    <div class="demo-section">
      <div class="demo-title">⚡ Akses Cepat Simulasi Role Internal (1-Klik)</div>
      
      <!-- KONSOL KOMANDO TERPADU (PAWAS & SPKT 110) -->
      <button class="btn-demo" style="border-color:#D97706; color:#1E3A8A; background:linear-gradient(135deg, #EFF6FF 0%, #FFFBEB 100%); text-align:left; padding:12px 14px; margin-bottom:10px; border-width:2px; box-shadow:0 3px 10px rgba(217,119,6,0.15);" onclick="quickLoginRole('88010234')">
        <div style="font-size:13.5px; font-weight:800; color:#1E3A8A; display:flex; align-items:center; gap:6px;">
          <span>👑🎧</span>
          <span>Login sbg KONSOL KOMANDO (PAWAS & SPKT 110)</span>
        </div>
        <div style="font-size:11px; font-weight:600; color:#B45309; margin-top:2px;">NRP: 88010234 • Kombes Pol Budi (Komando, Disposisi 110, Validasi & Peta Armada)</div>
      </button>

      <!-- PERSONEL 1: SAMAPTA PRESISI -->
      <button class="btn-demo" style="border-color:#153E75; color:#153E75; background:#F8FAFC; text-align:left; padding:10px 14px; margin-bottom:8px;" onclick="quickLoginRole('95020123')">
        <div style="font-size:13px; font-weight:800;">👮 Login sbg SAMAPTA R-4 (Bripka Ahmad)</div>
        <div style="font-size:11px; font-weight:500; color:#64748B;">NRP: 95020123 • Bripka Ahmad Subagyo (Patroli Roda 4)</div>
      </button>

      <!-- PERSONEL 2: TIM RAIMAS R-2 -->
      <button class="btn-demo" style="border-color:#D97706; color:#B45309; background:#FEF3C7; text-align:left; padding:10px 14px; margin-bottom:8px;" onclick="quickLoginRole('50129841')">
        <div style="font-size:13px; font-weight:800;">🏍️ Login sbg RAIMAS R-2 (Aipda Rudi)</div>
        <div style="font-size:11px; font-weight:500; color:#92400E;">NRP: 50129841 • Aipda Rudi Hartono (Motor Taktis Sabhara)</div>
      </button>

      <!-- PERSONEL 3: TURJAWALI SATLANTAS (ANGGOTA 1) -->
      <button class="btn-demo" style="border-color:#1D4ED8; color:#1D4ED8; background:#EFF6FF; text-align:left; padding:10px 14px; margin-bottom:8px;" onclick="quickLoginRole('49112233')">
        <div style="font-size:13px; font-weight:800;">🚓 Login sbg POLANTAS 1 (Aiptu Bambang)</div>
        <div style="font-size:11px; font-weight:500; color:#1E40AF;">NRP: 49112233 • Aiptu Bambang Sudrajat (Satlantas • Turjawali)</div>
      </button>

      <!-- PERSONEL 4: SATLANTAS (ANGGOTA 2 - KOLABORASI SATUAN) -->
      <button class="btn-demo" style="border-color:#2563EB; color:#1E40AF; background:#F0F9FF; text-align:left; padding:10px 14px; margin-bottom:8px;" onclick="quickLoginRole('93020101')">
        <div style="font-size:13px; font-weight:800;">🚓 Login sbg POLANTAS 2 (Bripka Hendro)</div>
        <div style="font-size:11px; font-weight:500; color:#0369A1;">NRP: 93020101 • Bripka Hendro P. (Satlantas • Rekan 1 Satuan)</div>
      </button>

      <!-- PERSONEL 5: OPSNAL RESKRIM -->
      <button class="btn-demo" style="border-color:#7C3AED; color:#6D28D9; background:#F5F3FF; text-align:left; padding:10px 14px; margin-bottom:12px;" onclick="quickLoginRole('96050119')">
        <div style="font-size:13px; font-weight:800;">🕵️ Login sbg OPSNAL RESKRIM (Bripka Agus)</div>
        <div style="font-size:11px; font-weight:500; color:#5B21B6;">NRP: 96050119 • Bripka Agus Salim (Sat Reskrim • Tim Tindak)</div>
      </button>

      <div class="demo-title" style="margin-top:16px;">⚙️ Pendaftaran & Administrasi Satuan</div>
      <button class="btn-demo" style="border-color:#059669; color:#047857; background:#ECFDF5; text-align:left; padding:10px 14px; margin-bottom:12px;" onclick="window.location.href='registrasi-unit.html'">
        <div style="font-size:13px; font-weight:800;">📝 Pendaftaran & Manajemen Satuan Unit Baru</div>
        <div style="font-size:11px; font-weight:500; color:#059669;">Daftarkan NRP, Pangkat, Unit Satuan, Regu, Password, Device ID & Status</div>
      </button>

      <div class="demo-title" style="margin-top:16px;">🌐 Portal Publik Warga (Masyarakat)</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <button class="btn-demo" style="border-color:#DC2626; color:#DC2626; background:#FEF2F2; font-size:11.5px; padding:10px 8px; margin:0;" onclick="window.location.href='masyarakat.html?mode=lapor'">
          🚨 Lapor Cepat & SOS Warga
        </button>
        <button class="btn-demo" style="border-color:#10B981; color:#047857; background:#F0FDF4; font-size:11.5px; padding:10px 8px; margin:0;" onclick="window.location.href='masyarakat.html?mode=lacak'">
          ⭐ Lacak Tiket & Evaluasi
        </button>
      </div>
    </div>
  </div>

  <script src="js/simapres-roster.js"></script>
  <script>
    function routeUserToPage(user) {
      if (!user) return;
      sessionStorage.setItem('simapres_active_user', JSON.stringify(user));

      if (user.role === 'pawas' || user.role === 'pimpinan' || user.unitId === 'pawas_spkt') {
        window.location.href = 'e-tribrata-log.html?role=pawas';
      } else if (user.role === 'operator') {
        window.location.href = 'e-tribrata-log.html?role=operator';
      } else {
        // Personel Lapangan (diarahkan ke modul personil.html terdedikasi)
        window.location.href = `personil.html?nrp=${encodeURIComponent(user.nrp)}`;
      }
    }

    function quickLoginRole(nrp) {
      const input = document.getElementById('login-nrp');
      if (input) input.value = nrp;

      const user = (typeof cariPersonelByNrp === 'function') ? cariPersonelByNrp(nrp) : null;
      setTimeout(() => {
        if (user) {
          routeUserToPage(user);
        } else {
          window.location.href = `e-tribrata-log.html?nrp=${encodeURIComponent(nrp)}`;
        }
      }, 150);
    }

    function handleInternalLogin(e) {
      e.preventDefault();
      const nrpVal = document.getElementById('login-nrp').value.trim();
      const user = (typeof cariPersonelByNrp === 'function') ? cariPersonelByNrp(nrpVal) : null;

      if (user) {
        routeUserToPage(user);
      } else {
        // Fallback jika NRP tidak dikenali
        const fallbackUser = {
          nrp: nrpVal || '95020123',
          nama: 'Petugas Lapangan',
          role: 'anggota',
          pangkat: 'BRIGADIR POLISI',
          jabatan: 'Unit Patroli Presisi',
          satuan: 'Satuan Samapta Presisi'
        };
        routeUserToPage(fallbackUser);
      }
    }
  </script>
</body>
</html>
