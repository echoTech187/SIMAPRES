<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Internal - E TRIBRATA LOG</title>
  <style>
    :root {
      --primary: #153E75;
      --primary-dark: #0F2D56;
      --secondary: #FBBF24;
      --bg: #F1F5F9;
      --text: #1E293B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .login-card {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .shield {
      width: 40px; height: 40px;
      background: var(--secondary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .shield::after { content: "🛡️"; font-size: 20px; }
    .brand-title { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #475569; }
    .form-control {
      width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px;
    }
    
    .btn-login {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px;
      font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    
    .demo-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed #E2E8F0;
    }
    .demo-title { font-size: 12px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
    
    .btn-demo {
      width: 100%; padding: 12px; border: 2px solid var(--primary); background: transparent; color: var(--primary);
      border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 10px;
      transition: background 0.2s;
    }
    .btn-demo:hover { background: var(--primary); color: white; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <div class="shield"></div>
      <div class="brand-title">E TRIBRATA LOG</div>
    </div>
    
    <div class="form-group">
      <label class="form-label">NRP / Username</label>
      <input type="text" class="form-control" placeholder="Masukkan NRP">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" placeholder="••••••••">
    </div>
    
    <button class="btn-login" onclick="alert('Gunakan tombol Demo Role di bawah')">LOGIN</button>
    
    <div class="demo-section">
      <div class="demo-title">Pilih Role Simulasi (Demo)</div>
      <button class="btn-demo" onclick="window.location.href='e-tribrata-log.html?role=anggota'">👮 Login sbg ANGGOTA / PERSONIL</button>
      <button class="btn-demo" onclick="window.location.href='e-tribrata-log.html?role=pimpinan'">👨‍✈️ Login sbg PIMPINAN</button>
    </div>
  </div>

</body>
</html>
