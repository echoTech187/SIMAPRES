<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Internal - E TRIBRATA LOG</title>
  <style>
    :root {
      --primary: #153E75;
      --primary-dark: #0F2D56;
      --secondary: #FBBF24;
      --bg: #F1F5F9;
      --text: #1E293B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .login-card {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .shield {
      width: 40px; height: 40px;
      background: var(--secondary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .shield::after { content: "🛡️"; font-size: 20px; }
    .brand-title { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #475569; }
    .form-control {
      width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px;
    }
    
    .btn-login {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px;
      font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    
    .demo-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed #E2E8F0;
    }
    .demo-title { font-size: 12px; color: #64748B; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
    
    .btn-demo {
      width: 100%; padding: 12px; border: 2px solid var(--primary); background: transparent; color: var(--primary);
      border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 10px;
      transition: background 0.2s;
    }
    .btn-demo:hover { background: var(--primary); color: white; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <div class="shield"></div>
      <div>
        <div class="brand-title">E TRIBRATA LOG</div>
        <div style="font-size: 11px; color: #64748B; font-weight: 600; letter-spacing: 0.5px;">SISTEM LOGBOOK & OPERASIONAL PRESISI</div>
      </div>
    </div>
    
    <form id="login-form" onsubmit="handleInternalLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-nrp">NRP / ID Petugas</label>
        <input type="text" id="login-nrp" class="form-control" placeholder="Masukkan NRP Petugas" value="98040112">
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label class="form-label" for="login-pass">Kata Sandi</label>
        <input type="password" id="login-pass" class="form-control" placeholder="••••••••" value="polripresisi2026">
      </div>
      
      <button type="submit" class="btn-login" style="display:flex; align-items:center; justify-content:center; gap:8px;">
        <span>MASUK KE SISTEM INTERNAL</span>
        <span>➔</span>
      </button>
    </form>
    
    <div class="demo-section">
      <div class="demo-title">⚡ Akses Cepat Simulasi Role Internal (1-Klik)</div>
      
      <!-- 3 ROLE INTERNAL DALAM SISTEM YANG SAMA -->
      <button class="btn-demo" style="border-color:#2563EB; color:#1D4ED8; background:#EFF6FF; text-align:left; padding:10px 14px; margin-bottom:8px;" onclick="quickLoginRole('98040112', 'operator')">
        <div style="font-size:13px; font-weight:800;">🎧 Login sbg OPERATOR SPKT 110</div>
        <div style="font-size:11px; font-weight:500; color:#3B82F6;">NRP: 98040112 • Briptu Dian Lestari (Penerima Telepon 110)</div>
      </button>

      <button class="btn-demo" style="border-color:#153E75; color:#153E75; background:#F8FAFC; text-align:left; padding:10px 14px; margin-bottom:8px;" onclick="quickLoginRole('95020123', 'anggota')">
        <div style="font-size:13px; font-weight:800;">👮 Login sbg ANGGOTA / PERSONEL</div>
        <div style="font-size:11px; font-weight:500; color:#64748B;">NRP: 95020123 • Bripka Ahmad (Respon TKP & Patroli)</div>
      </button>

      <button class="btn-demo" style="border-color:#D97706; color:#B45309; background:#FFFBEB; text-align:left; padding:10px 14px; margin-bottom:12px;" onclick="quickLoginRole('88010234', 'pimpinan')">
        <div style="font-size:13px; font-weight:800;">👨‍✈️ Login sbg PIMPINAN / PAWAS</div>
        <div style="font-size:11px; font-weight:500; color:#D97706;">NRP: 88010234 • Kombes Pol Budi (Validasi & Supervisi)</div>
      </button>

      <div class="demo-title" style="margin-top:16px;">🌐 Portal Publik Warga (Masyarakat)</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <button class="btn-demo" style="border-color:#DC2626; color:#DC2626; background:#FEF2F2; font-size:11.5px; padding:10px 8px; margin:0;" onclick="window.location.href='lapor-110.html'">
          🚨 Portal Warga (SOS 110)
        </button>
        <button class="btn-demo" style="border-color:#10B981; color:#047857; background:#F0FDF4; font-size:11.5px; padding:10px 8px; margin:0;" onclick="window.location.href='masyarakat.html'">
          ⭐ Lacak Tiket & Rating
        </button>
      </div>
    </div>
  </div>

  <script>
    function detectRoleFromNRP(nrpValue) {
      const nrp = (nrpValue || '').toLowerCase().trim();

      if (nrp.includes('operator') || nrp.includes('dian') || nrp.includes('98040112') || nrp.includes('spkt') || nrp.includes('110')) {
        return 'operator';
      } else if (nrp.includes('pimpinan') || nrp.includes('pawas') || nrp.includes('budi') || nrp.includes('kapolres') || nrp.includes('88010234')) {
        return 'pimpinan';
      } else {
        return 'anggota';
      }
    }

    function quickLoginRole(nrp, role) {
      const input = document.getElementById('login-nrp');
      if (input) input.value = nrp;
      setTimeout(() => {
        window.location.href = `e-tribrata-log.html?role=${role}`;
      }, 150);
    }

    function handleInternalLogin(e) {
      e.preventDefault();
      const nrp = document.getElementById('login-nrp').value;
      const targetRole = detectRoleFromNRP(nrp);
      window.location.href = `e-tribrata-log.html?role=${targetRole}`;
    }
  </script>
</body>
</html>
